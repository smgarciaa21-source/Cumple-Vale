<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#fff8fc,#ffd9ea);color:#6d2945;min-height:100vh;overflow-x:hidden}
.wrap{width:min(680px,100%);margin:auto;padding:14px}
.card{background:rgba(255,255,255,.86);border:3px solid #f5a8cc;border-radius:28px;box-shadow:0 12px 35px rgba(155,65,105,.18);overflow:hidden}
.hero img{display:block;width:100%;height:auto}
.content{padding:18px 18px 26px;text-align:center}
h1{margin:4px 0 8px;font-size:clamp(28px,8vw,48px);color:#e85b9d}
.subtitle{font-size:18px;margin:0 0 16px}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 20px}
.box{background:#ffe1ef;border:2px solid #f3a1c9;border-radius:18px;padding:10px 4px}
.num{font-size:clamp(22px,7vw,34px);font-weight:800;display:block;color:#a33b68}
.label{font-size:12px}
.buttons{display:grid;gap:10px}
a.btn{display:block;text-decoration:none;padding:14px 16px;border-radius:999px;font-weight:800;font-size:16px}
.whatsapp{background:#25d366;color:white}
.maps{background:#f48ab8;color:white}
.note{margin-top:15px;font-size:14px;opacity:.8}
.float{position:fixed;bottom:-30px;pointer-events:none;animation:rise linear forwards;z-index:5;font-size:22px}
@keyframes rise{from{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.9}to{transform:translateY(-110vh) rotate(360deg);opacity:0}}
@media(max-width:420px){.wrap{padding:8px}.content{padding:14px 12px 20px}}
</style>

<script>
const target = new Date("2026-11-27T18:00:00-05:00").getTime();
function update(){
  let d = target - Date.now();
  if(d < 0) d = 0;
  const day = Math.floor(d/86400000); d%=86400000;
  const hour = Math.floor(d/3600000); d%=3600000;
  const min = Math.floor(d/60000); d%=60000;
  const sec = Math.floor(d/1000);
  document.getElementById("days").textContent=String(day).padStart(2,"0");
  document.getElementById("hours").textContent=String(hour).padStart(2,"0");
  document.getElementById("mins").textContent=String(min).padStart(2,"0");
  document.getElementById("secs").textContent=String(sec).padStart(2,"0");
}
update(); setInterval(update,1000);
function floaty(){
  const e=document.createElement("div");
  e.className="float";
  e.textContent=["💗","🌸","🎀","🍓","♡"][Math.floor(Math.random()*5)];
  e.style.left=(Math.random()*100)+"vw";
  e.style.animationDuration=(5+Math.random()*5)+"s";
  e.style.fontSize=(16+Math.random()*14)+"px";
  document.body.appendChild(e);
  setTimeout(()=>e.remove(),10000);
}
setInterval(floaty,650);
</script>
